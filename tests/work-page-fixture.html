<!doctype html><html data-theme="light" class="theme-zai-light"><meta charset="utf-8"><style>
:root{--base:#f8fafc;--ink:#18212e;--color-popover:var(--base);--color-popover-foreground:var(--ink);font:14px sans-serif}html.dark{--base:#19212d;--ink:#f1f5f9}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--base)}#root{height:100vh;display:grid;grid-template-columns:170px 1fr;overflow:hidden}.mc-workbench-background{position:fixed;inset:0;z-index:-1}aside{padding:14px;background:var(--base)}main{display:grid;grid-template-columns:minmax(0,1fr) 230px;min-width:0;overflow:hidden}.thread-scroll-container{height:calc(100vh - 140px);overflow:auto;padding:20px}pre{max-width:100%;overflow-x:auto;background:var(--base);color:var(--ink);padding:12px}textarea{width:100%;height:60px;background:var(--base);color:var(--ink)}footer{position:fixed;left:190px;right:250px;bottom:12px;padding:10px;background:var(--base)}[data-testid=context-panel]{min-width:200px;background:var(--base);padding:16px}#case-menu{position:fixed;right:250px;top:35px;padding:20px;background:var(--color-popover);color:var(--color-popover-foreground);z-index:5}#case-settings{position:fixed;left:260px;right:80px;top:70px;bottom:100px;background:var(--base);color:var(--ink);z-index:6;padding:30px}button{color:inherit;background:var(--base);padding:7px}
